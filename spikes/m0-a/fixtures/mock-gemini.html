<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Mock Gemini Bro Chat (Fixture for M0-A Spike)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #131314;
      color: #e3e3e3;
    }
    .chat-container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      height: 90vh;
    }
    .conversation-history {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    user-query, .user-query {
      display: block;
      align-self: flex-end;
      background: #282a2c;
      padding: 12px 18px;
      border-radius: 18px 18px 4px 18px;
      max-width: 80%;
    }
    .query-text {
      font-size: 15px;
      color: #ffffff;
      word-break: break-word;
    }
    model-response, .model-response {
      display: block;
      align-self: flex-start;
      background: #1e1f20;
      padding: 16px 20px;
      border-radius: 18px 18px 18px 4px;
      max-width: 85%;
      border: 1px solid #333538;
    }
    .markdown {
      font-size: 15px;
      line-height: 1.6;
      color: #e3e3e3;
      white-space: pre-wrap;
    }
    message-actions, .response-footer {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      border-top: 1px solid #333538;
      padding-top: 8px;
      font-size: 12px;
      color: #8e918f;
    }
    .input-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1e1f20;
      border: 1px solid #444746;
      border-radius: 28px;
      padding: 8px 16px;
    }
    rich-textarea {
      flex: 1;
      display: block;
    }
    .ql-editor {
      min-height: 36px;
      max-height: 120px;
      outline: none;
      font-size: 15px;
      color: #fff;
      overflow-y: auto;
    }
    .ql-editor:empty:before {
      content: "問問 Gemini...";
      color: #8e918f;
    }
    button.send-button {
      background: #a8c7fa;
      color: #040e1b;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    button.send-button:disabled {
      background: #444746;
      color: #8e918f;
      cursor: not-allowed;
    }
    button.send-button.stop {
      background: #f28b82;
      color: #370000;
    }
    .stats-badge {
      font-family: monospace;
      font-size: 11px;
      color: #c4eed0;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="stats-badge" id="stats">Visibility: visible | Chunks: 0 | Hidden Events: 0</div>
    <div class="conversation-history" id="history">
      <!-- Existing turns can exist here -->
    </div>

    <div class="input-bar">
      <rich-textarea>
        <div class="ql-editor" contenteditable="true" role="textbox" aria-label="問問 Gemini"></div>
      </rich-textarea>
      <button class="send-button" id="mock-send-btn" aria-label="Send" title="Send" disabled>➔</button>
      <button class="send-button stop" id="mock-stop-btn" aria-label="Stop" title="Stop" style="display: none;">■</button>
    </div>
  </div>

  <script src="mock-gemini.js"></script>
</body>
</html>
