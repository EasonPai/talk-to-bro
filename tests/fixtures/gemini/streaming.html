<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Gemini - Generating</title>
</head>
<body>
  <div class="chat-history">
    <user-query class="ng-star-inserted">
      <div class="query-text">/wd ledger</div>
    </user-query>
    <model-response class="enable-lr26-response-chrome-updates ng-star-inserted">
      <message-content class="ng-star-inserted">
        <div class="markdown markdown-main-panel md-content" aria-busy="true" aria-live="polite">
          <h3>ledger</h3>
          <p>正在分析詞性與例句...</p>
        </div>
      </message-content>
    </model-response>
  </div>
  <div class="input-area">
    <rich-textarea class="text-input-field_textarea ql-container ql-bubble simplified-input ng-untouched ng-pristine ng-valid ng-star-inserted">
      <div class="ql-editor" contenteditable="true" role="textbox" aria-label="問問 Gemini"></div>
    </rich-textarea>
    <button class="send-button" aria-label="傳送" style="display: none;" disabled>傳送</button>
    <button class="send-button stop" aria-label="停止" style="display: flex;">停止</button>
  </div>
</body>
</html>
