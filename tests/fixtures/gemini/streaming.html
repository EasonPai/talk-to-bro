<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Gemini - Streaming</title>
</head>
<body>
  <div class="chat-history">
    <user-query>
      <div class="query-text">meticulous</div>
    </user-query>
    <model-response>
      <message-content>
        <div class="markdown">### 老大解析：meticulous&#10;&#10;正在生成釋義與例句...</div>
      </message-content>
    </model-response>
  </div>
  <div class="input-area">
    <rich-textarea>
      <div class="ql-editor" contenteditable="true" role="textbox" aria-label="問問 Gemini"></div>
    </rich-textarea>
    <button class="send-button" aria-label="傳送" style="display: none;" disabled>傳送</button>
    <button class="send-button stop" aria-label="停止" style="display: flex;">停止</button>
  </div>
</body>
</html>
